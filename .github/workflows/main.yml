name: Build A125F + KernelSU Next

on:
  workflow_dispatch:
    inputs:
      overclock:
        description: "Ep xung 2.5GHz (cpu0-3) / 2.0GHz (cpu4-7)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip curl python3 lld

      - name: Get Neutron clang
        run: |
          mkdir -p $HOME/tc && cd $HOME/tc
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/tc/bin" >> $GITHUB_PATH

      - name: Add KernelSU Next (legacy)
        run: |
          git ls-remote --heads https://github.com/KernelSU-Next/KernelSU-Next | tee heads.txt
          grep -q "refs/heads/legacy" heads.txt || { echo "Nhanh legacy khong ton tai"; exit 1; }
          rm -rf KernelSU drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          git -C KernelSU-Next branch --show-current

      - name: Add SuSFS
        run: |
          git clone --depth=1 -b kernel-4.19 \
            https://github.com/simonpunk/susfs4ksu susfs4ksu || \
          git clone --depth=1 \
            https://github.com/simonpunk/susfs4ksu susfs4ksu

          # Patch kernel source
          patch -p1 --forward \
            < susfs4ksu/kernel_patches/add_susfs_in_kernel-4.19.patch || true

          # Patch KernelSU Next
          cd KernelSU-Next
          patch -p1 --forward \
            < ../susfs4ksu/kernel_patches/add_susfs_in_kernelsu.patch || \
          patch -p1 --forward \
            < ../susfs4ksu/kernel_patches/add_susfs_in_gki-android14-6.1.patch || true
          cd ..
          echo "[+] SuSFS patched"

      - name: Patch KernelSU for this kernel
        run: |
          F=KernelSU-Next/kernel/hook/patch_memory.c
          sed -i '0,/#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)/s//#if 0/' $F
          python3 - <<'EOF'
          import re, sys
          p = "KernelSU-Next/kernel/runtime/ksud_integration.c"
          s = open(p).read()
          if "DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled)" in s:
              print("static key da co")
              sys.exit(0)
          anchor = "bool ksu_init_rc_hook __read_mostly = true;"
          if anchor not in s:
              sys.exit("Khong tim thay anchor ksu_init_rc_hook")
          s = s.replace(anchor,
              "#include <linux/jump_label.h>\n"
              "DEFINE_STATIC_KEY_TRUE(ksu_is_init_rc_hook_enabled);\n" + anchor, 1)
          m = re.search(r'static void do_stop_init_rc_hook\([^)]*\)\s*\{', s)
          if not m:
              sys.exit("Khong tim thay do_stop_init_rc_hook")
          s = s[:m.end()] + "\n\tstatic_branch_disable(&ksu_is_init_rc_hook_enabled);" + s[m.end():]
          open(p, "w").write(s)
          print("Da them static key + tat khi stop_init_rc_hook")
          EOF
          grep -n "ksu_is_init_rc_hook_enabled" KernelSU-Next/kernel/runtime/ksud_integration.c

      - name: Stub missing nomount
        run: |
          rm -rf fs/nomount
          mkdir -p fs/nomount
          touch fs/nomount/Kconfig fs/nomount/Makefile

      - name: Build
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          FLAGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE"
          mkdir -p out
          make O=out A125F_defconfig $FLAGS
          scripts/config --file out/.config \
            -e KSU \
            -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e OVERLAY_FS \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOFER \
            -e KSU_SUSFS_ENABLE_LOG
          make O=out olddefconfig $FLAGS
          make O=out -j$(nproc) $FLAGS 2>&1 | tee build.log

      - name: Overclock DTB
        if: ${{ inputs.overclock }}
        run: |
          python3 - <<'EOF'
          import struct, sys, shutil
          src = "out/arch/arm64/boot/dts/mediatek/mt6765.dtb"
          shutil.copy(src, src.replace(".dtb", ".stock.dtb"))
          d = bytearray(open(src, "rb").read())
          magic, total, off_struct, off_str, off_rsv, ver, lc, bc, sz_str, sz_struct = struct.unpack('>10I', d[:40])
          strs = bytes(d[off_str:off_str + sz_str])
          def nm(o): return strs[o:strs.index(b'\0', o)].decode()
          i = off_struct
          path = []
          props = {}
          while True:
              t = struct.unpack('>I', d[i:i + 4])[0]; i += 4
              if t == 1:
                  n = bytes(d[i:d.index(b'\0', i)]).decode()
                  i += (len(n) + 1 + 3) // 4 * 4
                  path.append(n)
              elif t == 2:
                  path.pop()
              elif t == 3:
                  ln, no = struct.unpack('>II', d[i:i + 8]); i += 8
                  props[('/'.join(path), nm(no))] = (i, ln)
                  i += (ln + 3) // 4 * 4
              elif t == 9:
                  break
          def top(table):
              best = None
              for (p, n), (o, l) in props.items():
                  if p.startswith('/%s/' % table) and n == 'opp-hz' and l == 8:
                      hz = struct.unpack('>Q', d[o:o + 8])[0]
                      if best is None or hz > best[0]:
                          best = (hz, p)
              return best
          plan = (("opp_table0", 2500000000, 1281250, "0"),
                  ("opp_table1", 2000000000, 1237500, "1"))
          for table, hz, uv, cl in plan:
              b = top(table)
              if not b:
                  sys.exit("Khong thay %s trong DTB" % table)
              old, p = b
              o, l = props[(p, 'opp-hz')]
              d[o:o + 8] = struct.pack('>Q', hz)
              o, l = props[(p, 'opp-microvolt')]
              oldv = struct.unpack('>I', d[o:o + 4])[0]
              for k in range(l // 4):
                  d[o + 4 * k:o + 4 * k + 4] = struct.pack('>I', uv)
              print("%s (%s): %d MHz/%d mV -> %d MHz/%d mV" % (table, p, old // 10**6, oldv // 1000, hz // 10**6, uv // 1000))
              n = 0
              for (pp, name), (o, l) in props.items():
                  if name == 'clock-frequency' and l == 4 and pp.startswith('/cpus/cpu@%s0' % cl):
                      d[o:o + 4] = struct.pack('>I', hz)
                      n += 1
              print("  clock-frequency cap nhat cho %d cpu" % n)
          open(src, "wb").write(d)
          print("Xong")
          EOF

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp out/arch/arm64/boot/Image.gz AK3/
          cp out/arch/arm64/boot/dts/mediatek/mt6765.dtb AK3/dtb
          cat > AK3/anykernel.sh << 'EOF'
          kernel.string=Haruka KSUNext + SuSFS | SM-A125F
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a12
          device.name2=a12nsxx
          device.name3=A125F
          block=/dev/block/platform/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          EOF
          cd AK3
          zip -r9 ../Haruka-KSUNext-SuSFS-A125F.zip . \
            --exclude=.git --exclude=*.zip
          echo "[+] AnyKernel3 zip ready"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haruka-a125f-ksunext-susfs
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/mediatek/mt6765.dtb
            out/arch/arm64/boot/dts/mediatek/mt6765.stock.dtb
            Haruka-KSUNext-SuSFS-A125F.zip
            build.log

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksunext-${{ github.run_number }}
          name: Haruka A125F + KernelSU Next #${{ github.run_number }}
          files: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/mediatek/mt6765.dtb
            out/arch/arm64/boot/dts/mediatek/mt6765.stock.dtb
            Haruka-KSUNext-SuSFS-A125F.zip
            build.log
