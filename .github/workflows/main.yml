name: Build A125F + KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip curl python3 lld

      - name: Get Neutron clang
        run: |
          mkdir -p $HOME/tc && cd $HOME/tc
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/tc/bin" >> $GITHUB_PATH

      - name: Add KernelSU Next (legacy)
        run: |
          git ls-remote --heads https://github.com/KernelSU-Next/KernelSU-Next | tee heads.txt
          grep -q "refs/heads/legacy" heads.txt || { echo "Nhanh legacy khong ton tai"; exit 1; }
          rm -rf KernelSU drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          git -C KernelSU-Next branch --show-current

      - name: Patch KernelSU for this kernel
        run: |
          F=KernelSU-Next/kernel/hook/patch_memory.c
          echo "--- truoc khi va ---"
          sed -n 1,35p $F
          python3 - <<'EOF'
          import re
          p = "KernelSU-Next/kernel/hook/patch_memory.c"
          s = open(p).read()
          s2 = re.sub(r'[ \t]*#[ \t]*define[ \t]+copy_to_kernel_nofault\([^)]*\)[^\n]*(?:\\\n[^\n]*)*\n', '', s)
          open(p, "w").write(s2)
          print("da xoa macro:", s != s2)
          EOF
          echo "--- sau khi va ---"
          sed -n 1,35p $F

      - name: Stub missing nomount
        run: |
          rm -rf fs/nomount
          mkdir -p fs/nomount
          touch fs/nomount/Kconfig fs/nomount/Makefile

      - name: Build
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          FLAGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE"
          mkdir -p out
          make O=out A125F_defconfig $FLAGS
          scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e OVERLAY_FS
          make O=out olddefconfig $FLAGS
          make O=out -j$(nproc) $FLAGS 2>&1 | tee build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haruka-a125f-ksunext
          path: |
            out/arch/arm64/boot/Image*
            build.log

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksunext-${{ github.run_number }}
          name: Haruka A125F + KernelSU Next #${{ github.run_number }}
          files: |
            out/arch/arm64/boot/Image*
            build.log
